server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location / {
        try_files $uri $uri/ =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
    }
    location /imagens/ {
        expires 7d;
        try_files $uri =404;
    }
}
